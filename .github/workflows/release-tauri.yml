name: Release JPOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "jpos-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release-windows:
    name: Build and publish Windows updater
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_SHOP_ID: "20692"
      NEXT_PUBLIC_JPULSE_API_URL: https://be-wms-107789134874.asia-southeast1.run.app
      NEXT_PUBLIC_INVOICE_REQUEST_BASE_URL: https://jpulse.joyworldcityfuns.vn/invoice-request

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production release environment
        shell: pwsh
        run: |
          if ($env:NEXT_PUBLIC_FIREBASE_PROJECT_ID -ne "jw-system-f2104") {
            throw "Release must use the production Firebase project."
          }
          if ($env:NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN -ne "jw-system-f2104.firebaseapp.com") {
            throw "Release must use the production Firebase auth domain."
          }
          if ($env:NEXT_PUBLIC_JPOS_TEST_MODE -eq "true") {
            throw "A test app cannot be published through the production updater."
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.identifier -ne "com.jpos.system" -or $config.productName -ne "JPOS") {
            throw "Release must retain the production application identity."
          }
          if (-not $config.plugins.updater.pubkey -or -not $config.bundle.createUpdaterArtifacts) {
            throw "Release requires configured and signed updater artifacts."
          }
          node --test test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and publish JPOS
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: jpos-v__VERSION__
          releaseName: JPOS v__VERSION__
          releaseBody: |
            Bản cập nhật JPOS v__VERSION__.

            - Tự đối soát đơn PayOS đã hoàn thành thủ công khi webhook hoặc API xác nhận đã nhận đủ tiền; giữ lịch sử nhân viên xác nhận và thời điểm hoàn thành đơn.
            - Cảnh báo sau 5 phút bằng toast có nút “Xem đơn”; mở đúng ngày, cuộn đến và tô sáng đơn cần kiểm tra.
            - Badge trên sidebar đếm đơn PayOS còn chờ xác nhận, kể cả thông báo đã xem; tự cập nhật khi PayOS xác nhận.
            - Kết ca và bản in tách số tiền PayOS đã xác nhận/chờ đối soát, kiểm tra lại trước khi in và cảnh báo các đơn chưa được xác nhận.
            - Kiểm tra nền với lease/backoff, xác thực chữ ký và số tiền; chỉ cảnh báo đơn PayOS, loại trừ tiền mặt và QR tài khoản cố định.

            Ứng dụng JPOS sẽ tự kiểm tra, xác thực chữ ký và cài đặt bản phát hành này.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Authenticate Google Cloud release mirror
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/107789134874/locations/global/workloadIdentityPools/github-actions/providers/github-pos
          service_account: github-jpos-release@jw-system-f2104.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Mirror installer to Firebase Storage
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "jpos-v$version"
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $release.assets |
            Where-Object { $_.name -match '_x64-setup\.exe$' } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Không tìm thấy installer NSIS trong release $tag."
          }

          $manifestDirectory = Join-Path $env:RUNNER_TEMP "jpos-updater-manifest"
          New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
          gh release download $tag --pattern $installer.name --dir $manifestDirectory --clobber
          gh release download $tag --pattern latest.json --dir $manifestDirectory --clobber
          $installerPath = Join-Path $manifestDirectory $installer.name
          $manifestPath = Join-Path $manifestDirectory "latest.json"
          $storageObject = "gs://jw-system-f2104.firebasestorage.app/jpos-updates/$version/$($installer.name)"
          $downloadToken = [guid]::NewGuid().ToString()
          gcloud storage cp $installerPath $storageObject
          gcloud storage objects update $storageObject `
            --content-type=application/octet-stream `
            --cache-control="public,max-age=31536000,immutable" `
            --custom-metadata="firebaseStorageDownloadTokens=$downloadToken"

          $encodedObject = [uri]::EscapeDataString("jpos-updates/$version/$($installer.name)")
          $mirrorUrl = "https://firebasestorage.googleapis.com/v0/b/jw-system-f2104.firebasestorage.app/o/$encodedObject`?alt=media&token=$downloadToken"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $mirrorUrl
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8NoBOM
          gh release upload $tag $manifestPath --clobber
